<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reidyy Ticket System</title><style>:root{color-scheme:dark;--accent:#b881f7}*{box-sizing:border-box}body{margin:0;background:#0c0c14;color:#eee7f6;font:14px system-ui}header{padding:25px 5%;border-bottom:1px solid #352b43;display:flex;justify-content:space-between;align-items:center}header b{font-size:22px}main{max-width:1200px;margin:auto;padding:35px 20px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}button,a{cursor:pointer}button{background:#241c30;border:1px solid #59406e;color:#eedcff;padding:11px 16px;border-radius:8px;transition:.2s}button:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 6px 20px #b881f720}input,select,textarea{display:block;width:100%;background:#10101b;color:white;border:1px solid #46394f;border-radius:7px;padding:13px;margin:12px 0 20px;font:inherit}textarea{min-height:130px}label{display:block;margin-top:20px;color:#ccc0da}h1{font-size:32px}p,small{color:#a99ab8;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{background:linear-gradient(135deg,#1b1628,#14151f);border:1px solid #393044;padding:24px;border-radius:12px;margin-bottom:18px}.action{text-align:left;min-height:150px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.badge{border:1px solid #6a447e;border-radius:20px;padding:5px 10px;font-size:11px;color:#ddb1f3}.message{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere}.staff{border-left:3px solid var(--accent)}.error{background:#482233;padding:15px;border-radius:7px;color:#ffc2da}a{color:#e7b2fa}.tools{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#a495b3}.logo{max-width:140px;max-height:55px}button:disabled{opacity:.4;cursor:default}pre{white-space:pre-wrap}#notice{position:fixed;bottom:20px;right:20px;max-width:450px;background:#472c58;padding:16px;border-radius:10px;display:none}@media(max-width:600px){header{align-items:flex-start;gap:15px;flex-direction:column}h1{font-size:26px}}</style><link rel="stylesheet" href="/extended.css"></head><body><header><b id="brand">Reidyy Ticket System</b><span id="identity"></span></header><main id="app"></main><div id="notice" role="status"></div><script>
let user,perms=[],data=[],settings={},page='home',selected=null;const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const can=p=>perms.includes(p);async function api(path,body){let r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.error);return d}function notice(t){$('#notice').textContent=t;$('#notice').style.display='block';setTimeout(()=>$('#notice').style.display='none',5000)}async function task(fn){try{await fn()}catch(e){notice(e.message)}}async function load(){let session=await api('session');user=session.user;perms=session.permissions;if(!user){$('#app').innerHTML=`<h1>Welcome to Reidyy Ticket System</h1><p>Sign in to create tickets and applications.</p><a href="/auth/discord">Sign in with Discord</a>${session.demo?'<div class="card"><h2>Local demo access</h2><p>Demo identities are for testing only. Disable DEMO_MODE before hosting publicly.</p>'+['player','reviewer','support','admin','management'].map(g=>`<button onclick="demo('${g}')">${g}</button>`).join(' ')+'</div>':''}`;return}let d=await api('data');data=d.records;settings=d.settings;document.documentElement.style.setProperty('--accent',settings.color);document.title=settings.name;$('#brand').textContent=settings.name;if(settings.logo&&/^https:\/\//.test(settings.logo))$('#brand').innerHTML=`<img class="logo" src="${esc(settings.logo)}" alt="Panel logo"> ${esc(settings.name)}`;$('#identity').textContent=user.name;render()}async function demo(group){await task(async()=>{await api('demo',{group});await load()})}function go(p,id){page=p;selected=id;render()}function nav(){return `<nav>${[['home','Dashboard'],['tickets','Tickets'],['applications','Applications'],['rules','Server rules'],...(can('cases')?[['cases','Cases']]:[]),...(can('players')?[['players','Player profiles']]:[]),...(can('settings')?[['settings','Management']]:[])].map(([id,name])=>`<button onclick="go('${id}')">${name}</button>`).join('')}<button onclick="task(async()=>{await api('logout',{});location.reload()})">Sign out / Unlink session</button></nav>`}function render(){let html=nav();if(page==='home')html+=`<h1>What would you like to do today?</h1><div class="grid">${Object.entries(settings.forms).map(([key,f])=>`<button class="card action" ${!f.open?'disabled':''} onclick="go('apply','${key}')"><h2>${esc(key)} Application</h2><span class="badge">${f.open?'Apply now →':'Applications Closed'}</span></button>`).join('')}<button class="card action" onclick="newTicket('General support')"><h2>Make a Ticket</h2>Get help or submit a report →</button><button class="card action" onclick="newTicket('Custom work request')"><h2>Custom Work Request</h2>Discuss your project →</button></div>`;
if(page==='tickets')html+=ticketList();if(page==='ticket')html+=ticketDetail();if(page==='applications')html+=`<h1>Applications</h1>${data.filter(r=>r.kind==='application').map(r=>`<button class="card" style="width:100%;text-align:left" onclick="go('review',${r.id})">#${r.id} ${esc(r.type)} · ${esc(r.status)} · ${esc(r.owner)}</button>`).join('')||'<p>No applications yet.</p>'}`;
if(page==='apply')html+=applicationForm(selected);if(page==='review')html+=applicationReview();if(page==='rules')html+=`<h1>Server rules</h1><div class="card message">${esc(settings.rules)}</div>`;if(page==='cases')html+=`<div class="row"><h1>Cases</h1><button onclick="createCase()">＋ Case</button></div>${data.filter(r=>r.kind==='case').map(r=>`<button class="card" onclick="go('case',${r.id})">#${r.id} ${esc(r.title)}</button>`).join('')}`;if(page==='case')html+=caseDetail();if(page==='players')html+=playerPage();if(page==='settings')html+=`<h1>Management</h1><p>Configure branding, rules, categories, application questions/minimums and availability, groups and permissions, Discord role IDs, and notification exclusions. Changes save to the database.</p><p>Permission names: tickets, cases, players, server, applications, settings, rules, permissions.</p><form onsubmit="saveSettings(event)"><label>Panel configuration (JSON)</label><textarea id="config" style="min-height:600px;font-family:monospace">${esc(JSON.stringify(settings,null,2))}</textarea><button>Save configuration</button></form><p>Secrets are configured on the server, never in this editor.</p>`;$('#app').innerHTML=html}
function ticketList(){let tickets=data.filter(r=>r.kind==='ticket');let count=tickets.filter(r=>r.resolvedBy===user.id&&r.resolvedAt>Date.now()/1000-90*86400).length;return `<div class="row"><h1>Tickets</h1><button onclick="newTicket('General support')">＋ New ticket</button></div>${can('tickets')?`<p>${tickets.filter(r=>r.status!=='Resolved').length} open · ${count} resolved by you in 90 days</p><select id="queue-filter" onchange="filterTickets(this.value)"><option>All</option><option>Open</option><option>Claimed</option><option>Unclaimed</option><option>Mine</option></select>`:''}<div id="ticket-rows">${ticketRows(tickets)}</div>`}function ticketRows(tickets){return tickets.map(r=>`<button class="card" style="width:100%;text-align:left" onclick="go('ticket',${r.id})"><div class="row"><b>#${r.id} ${esc(r.title)}</b><span class="badge">${esc(r.status)}</span></div><p>${esc(r.category)} · ${esc(r.owner)} · ${r.claimed?'Claimed by '+esc(r.claimed):'Unclaimed'}</p></button>`).join('')||'<p>No tickets.</p>'}function filterTickets(f){let tickets=data.filter(r=>r.kind==='ticket');$('#ticket-rows').innerHTML=ticketRows(tickets.filter(r=>f==='All'||f==='Open'&&r.status!=='Resolved'||f==='Claimed'&&r.claimed&&r.status!=='Resolved'||f==='Unclaimed'&&!r.claimed&&r.status!=='Resolved'||f==='Mine'&&r.claimed===user.id&&r.status!=='Resolved'))}
function ticketDetail(){let r=data.find(x=>x.id===selected);let cases=data.filter(c=>c.kind==='case'&&(c.reports.includes(r.id)||c.id===r.caseId));return `<button onclick="go('tickets')">← Tickets</button><h1>#${r.id} ${esc(r.title)}</h1>${can('tickets')?cases.map(c=>`<div class="card">Linked to case #${c.id} ${can('cases')?`<button onclick="go('case',${c.id})">Open case</button>`:''}</div>`).join(''):''}<div class="row"><span class="badge">${esc(r.status)}</span><p>Player: ${esc(r.owner)}</p></div>${can('tickets')?`<div class="tools"><button onclick="update(${r.id},'claim',{claim:!r.claimed})">${r.claimed?'Unclaim':'Claim'}</button><select style="width:auto" onchange="update(${r.id},'status',{status:this.value})">${['Open','Under review','Awaiting response','Resolved'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select><button onclick="addParticipant(${r.id})">＋ Participant</button></div>`:''}${r.messages.map(m=>`<div class="card ${m.staff?'staff':''}"><div class="row"><b>${esc(m.author)} ${m.staff?'· STAFF':''}</b><small>${new Date(m.at*1000).toLocaleString()}</small></div><p class="message">${esc(m.text)}</p>${m.staff?`<small>${esc(settings.name)}</small>`:''}</div>`).join('')}${r.status==='Resolved'&&!can('tickets')?'<div class="card">Ticket closed. This conversation is read-only.</div>':`<form onsubmit="reply(event,${r.id})"><textarea name="text" required placeholder="Write your reply"></textarea><button>Send reply</button></form>`}${can('tickets')?`<h2>Internal notes</h2>${(r.notes||[]).map(n=>`<div class="card message">${esc(n.text)}</div>`).join('')}<button onclick="addNote(${r.id})">＋ Internal note</button>`:''}`}
async function refresh(){await load()}async function update(id,action,extras){await task(async()=>{await api('update',{id,action,...extras});await refresh()})}function newTicket(category){let options=Object.keys(settings.categories);if(!options.includes(category))options.push(category);$('#app').innerHTML=nav()+`<h1>New ticket</h1><form onsubmit="submitTicket(event)"><label>Title</label><input name="title" required><label>Category</label><select name="category" onchange="document.querySelector('#ticket-text').value=settings.categories[this.value]||''">${options.map(c=>`<option ${c===category?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Description and evidence links</label><textarea id="ticket-text" name="text" required>${esc(settings.categories[category]||'')}</textarea><button>Submit ticket</button></form>`}async function submitTicket(e){e.preventDefault();let form=Object.fromEntries(new FormData(e.target));await task(async()=>{let r=await api('create',{kind:'ticket',data:form});page='ticket';selected=r.id;await refresh()})}async function reply(e,id){e.preventDefault();await update(id,'reply',{text:new FormData(e.target).get('text')})}function addParticipant(id){let discordId=prompt('Discord user ID');if(discordId)update(id,'participant',{discordId})}function addNote(id){let text=prompt('Internal note (staff only)');if(text)update(id,'note',{text})}
function applicationForm(type){let f=settings.forms[type];return `<h1>${esc(type)} Application</h1><form onsubmit="submitApplication(event,'${type}')">${f.questions.map((q,i)=>`<div class="card"><label>${i+1}. ${esc(q.text)}</label><textarea name="q${i}" required minlength="${Number(q.min)}"></textarea><small>Minimum ${Number(q.min)} characters · No maximum</small></div>`).join('')}<button>Submit application</button></form>`}async function submitApplication(e,type){e.preventDefault();let fields=new FormData(e.target);await task(async()=>{let r=await api('create',{kind:'application',data:{type,answers:settings.forms[type].questions.map((q,i)=>fields.get('q'+i))}});page='review';selected=r.id;await refresh()})}function applicationReview(){let r=data.find(x=>x.id===selected);return `<h1>${esc(r.type)} Application #${r.id}</h1><p>${new Date(r.created*1000).toLocaleString()} · Previous attempts: ${r.attempts} · Last rejection: ${esc(r.lastRejection||'None')}</p><span class="badge">${esc(r.status)}</span>${r.questions.map((q,i)=>`<div class="card"><h3>${esc(q.text)}</h3><p class="message">${esc(r.answers[i])}</p>${can('applications')?'<button onclick="notice(\'No AI detector connected. No reliable percentage can be assigned.\')">AI Checker</button>':''}</div>`).join('')}<p>${esc(r.reason||'')}</p>${can('applications')?`<div class="tools">${['Under review','Accepted','Rejected'].map(s=>`<button onclick="decision(${r.id},'${s}')">${s}</button>`).join('')}</div>`:''}`}function decision(id,status){let reason=prompt('Decision reason / feedback')||'';update(id,'decision',{status,reason})}
async function createCase(){let title=prompt('Case title');if(title)await task(async()=>{let r=await api('create',{kind:'case',data:{title}});page='case';selected=r.id;await refresh()})}function caseDetail(){let c=data.find(x=>x.id===selected);return `<h1>Case #${c.id} ${esc(c.title)}</h1><div class="card"><div class="row"><h2>Linked reports</h2><button onclick="reportPicker(${c.id})">＋</button></div>${c.reports.map(id=>`<button onclick="go('ticket',${id})">Report #${id}</button>`).join('')}</div><div class="card"><div class="row"><h2>Involved players</h2><button onclick="casePlayer(${c.id})">＋ Discord ID</button></div>${c.players.map(id=>`<p>${esc(id)} <button onclick="outreach(${c.id},'${esc(id)}')">Open staff-to-player ticket</button></p>`).join('')}</div><h2>Case notes</h2>${c.notes.map(n=>`<div class="card message">${esc(n.text)}</div>`).join('')}<button onclick="addNote(${c.id})">＋ Note</button>`}function reportPicker(id){let tickets=data.filter(t=>t.kind==='ticket');$('#app').innerHTML=nav()+`<h1>Attach reports</h1><input placeholder="Search report ID" oninput="document.querySelectorAll('.report-choice').forEach(x=>x.hidden=!x.dataset.id.includes(this.value.replace('#','')))"><form onsubmit="attachReports(event,${id})">${tickets.map(t=>`<label class="card report-choice" data-id="${t.id}"><input style="display:inline;width:auto" name="ids" type="checkbox" value="${t.id}"> #${t.id} ${esc(t.title)}</label>`).join('')}<button>Add selected reports</button></form>`}async function attachReports(e,id){e.preventDefault();page='case';selected=id;await update(id,'reports',{ids:new FormData(e.target).getAll('ids')})}function casePlayer(id){let discordId=prompt('Discord user ID');if(discordId)update(id,'player',{discordId})}async function outreach(caseId,target){let title=prompt('Ticket title'),text=prompt('Initial message');if(title&&text)await task(async()=>{let r=await api('create',{kind:'ticket',data:{title,text,target,caseId,category:'Staff-to-player'}});page='ticket';selected=r.id;await refresh()})}
function playerPage(){return `<h1>Player profiles & bans</h1><button onclick="profile()">＋ Player note</button><button onclick="ban()">Record ban & appeal date</button>${data.filter(r=>r.kind==='profile'||r.kind==='ban').map(r=>`<div class="card"><b>${esc(r.owner)} · ${r.kind}</b><p>${esc(r.notes||r.reason)}</p>${r.appealAt?'<p>Appeals available '+new Date(r.appealAt*1000).toLocaleString()+'</p>':''}</div>`).join('')}<h2>Live server actions</h2><p>Requires an installed bridge and permission.</p><button onclick="serverAction('kick')">Kick player</button><button onclick="serverAction('ban')">Ban player</button>`}async function profile(){let discordId=prompt('Discord ID'),notes=prompt('Profile note');if(discordId&&notes)await task(async()=>{await api('create',{kind:'profile',data:{discordId,notes}});await refresh()})}async function ban(){let discordId=prompt('Discord ID'),reason=prompt('Ban reason'),date=prompt('Appeal eligible date (YYYY-MM-DD)');if(discordId&&reason&&date)await task(async()=>{let appealAt=Date.parse(date)/1000;if(!Number.isFinite(appealAt))throw Error('Invalid date');await api('create',{kind:'ban',data:{discordId,reason,appealAt}});await refresh()})}async function serverAction(action){let discordId=prompt('Discord ID'),reason=prompt('Reason');if(discordId&&reason)await task(async()=>{let r=await api('server',{action,discordId,reason});notice(JSON.stringify(r))})}async function saveSettings(e){e.preventDefault();await task(async()=>{await api('settings',{settings:JSON.parse($('#config').value)});await refresh();notice('Settings saved')})}
</script><script src="/workflows.js"></script></body></html>
